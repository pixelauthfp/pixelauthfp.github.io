<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXELAUTH</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;}
        body{min-height:100dvh;background:#0a0a1f;color:#e0e0ff;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;
            background-image:radial-gradient(circle at 20% 80%,rgba(120,119,198,0.15)0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(255,55,95,0.12)0%,transparent 50%);}
        .card{background:rgba(15,15,35,0.75);backdrop-filter:blur(24px);border-radius:32px;padding:48px 32px;max-width:420px;width:100%;text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 80px rgba(136,108,228,0.15);border:1px solid rgba(136,108,228,0.2);position:relative;overflow:hidden;}
        .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#ff0a1f,#886ce4,#00d4ff);opacity:0.7;}
        .logo{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#ff0a1f,#886ce4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;}
        .subtitle{font-size:14px;opacity:0.7;letter-spacing:3px;margin-bottom:40px;}
        .code-display{display:flex;flex-direction:column;align-items:center;gap:12px;margin:32px 0;padding:28px 20px;background:rgba(30,30,60,0.4);border-radius:20px;cursor:pointer;transition:all .3s;user-select:none;}
        .code-display:hover{background:rgba(50,50,90,0.5);transform:translateY(-4px);box-shadow:0 20px 40px rgba(136,108,228,0.2);}
        .code-full{font-family:'JetBrains Mono',monospace;font-size:clamp(48px,14vw,76px);font-weight:800;background:linear-gradient(90deg,#ff0a1f 0%,#ff4e6e 50%,#886ce4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .copy-hint{font-size:15px;opacity:0.8;color:#c0a8ff;line-height:1.4;}
        .copy-hint small{font-size:12px;opacity:0.6;display:block;}
        .timer{font-family:'JetBrains Mono',monospace;font-size:64px;font-weight:700;margin:20px 0 4px;background:linear-gradient(90deg,#ff0a1f,#886ce4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .timer-label{font-size:14px;opacity:0.65;color:#b19cd9;margin-bottom:6px;line-height:1.4;}
        .timer-label small{font-size:11px;opacity:0.6;display:block;}
        .secret-hint{font-size:12px;color:#aaa;opacity:0.7;letter-spacing:1.3px;margin-top:24px;font-family:'JetBrains Mono',monospace;user-select:text;}
        progress{width:100%;height:8px;border-radius:4px;background:rgba(255,255,255,0.1);margin-top:16px;border:none;appearance:none;}
        progress::-webkit-progress-bar{background:rgba(255,255,255,0.1);border-radius:4px;}
        progress::-webkit-progress-value{background:linear-gradient(90deg,#ff0a1f,#886ce4);border-radius:4px;}
        progress::-moz-progress-bar{background:linear-gradient(90deg,#ff0a1f,#886ce4);border-radius:4px;}
        .copied{position:fixed;top:-100px;left:50%;transform:translateX(-50%);background:linear-gradient(110deg,#a78bfa,#7c3aed,#6b46c1);color:#fff;padding:15px 42px;border-radius:50px;font-weight:700;font-size:18px;box-shadow:0 12px 35px rgba(124,58,237,0.4);transition:all .45s;z-index:1000;opacity:0;}
        .copied.show{top:40px;opacity:1;}
        .error{color:#ff6b6b;margin-top:20px;font-size:14px;}
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">PIXELAUTH</div>
        <div class="subtitle">SECURE OTP GENERATOR</div>
       
        <div class="code-display" id="code-block">
            <div class="code-full" id="code">------</div>
            <div class="copy-hint">
                Нажми, чтобы скопировать
                <small>Click to copy</small>
            </div>
        </div>
       
        <div class="timer" id="timer">30</div>
        <div class="timer-label">
            Время до обновления кода
            <small>Time until code refresh</small>
        </div>
       
        <progress id="progress" value="0" max="30"></progress>
        <div class="secret-hint" id="secret-hint"></div>
        <div class="error" id="error"></div>
    </div>
   
    <div class="copied" id="copied">
        Скопировано!
        <small>Copied!</small>
    </div>
    
    <script>
        const params = new URLSearchParams(location.search);
        const hasSecret = params.has('2fa') || params.has('secret');
        let timeOffset = 0;
        let lastPeriod = -1;
        let isFetching = false;
        
        async function syncWithServer() {
            if (isFetching) return;
            isFetching = true;
            try {
                const start = performance.now();
                const res = await fetch(`${location.pathname}?json=1&${params.toString()}&t=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) throw new Error();
                const data = await res.json();
                document.getElementById('code').textContent = data.code;
                document.getElementById('secret-hint').textContent = data.secret;
                const latency = performance.now() - start;
                timeOffset = data.serverTime - Date.now() + latency / 2;
            } catch (e) {
                console.warn('2FA sync error');
            } finally {
                isFetching = false;
            }
        }
        
        function tick() {
            const now = Date.now();
            const serverNow = now + timeOffset;
            const currentPeriod = Math.floor(serverNow / 30000);
            const msIntoPeriod = serverNow % 30000;
            const secondsElapsed = Math.floor(msIntoPeriod / 1000);
            const secondsLeft = 30 - secondsElapsed;
            document.getElementById('timer').textContent = secondsLeft < 10 ? '0' + secondsLeft : secondsLeft;
            document.getElementById('progress').value = secondsElapsed;
            
            if (currentPeriod !== lastPeriod) {
                lastPeriod = currentPeriod;
                syncWithServer();
            }
        }
        
        document.getElementById('code-block').onclick = () => {
            const code = document.getElementById('code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const toast = document.getElementById('copied');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        };
        
        if (hasSecret) {
            syncWithServer().then(() => {
                lastPeriod = Math.floor((Date.now() + timeOffset) / 30000);
                setInterval(tick, 250);
                tick();
            });
        } else {
            document.getElementById('error').textContent = '2-FA ТОКЕН НЕ УКАЗАН';
        }
    </script>
</body>
</html>
